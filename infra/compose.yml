services:
  postgres:
    image: postgres:16-alpine
    container_name: treasuryos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: treasuryos
    ports:
      - "5432:5432"
    volumes:
      - treasuryos_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: treasuryos-redis
    ports:
      - "6379:6379"

volumes:
  treasuryos_pg_data:
